<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swiss Tax Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      width: 260px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 18px;
      text-align: center;
    }
    button {
      margin-top: 15px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background-color: #007acc;
      color: #fff;
    }
    button:hover {
      background-color: #005fa3;
    }
  </style>
</head>
<body>
<h2 id="title">Swiss Tax Calculator</h2>
<button id="optionsButton">Adjust My Tax Settings</button>

<script src="popup.js"></script>
</body>
</html>
